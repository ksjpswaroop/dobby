[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dobby"
version = "0.1.0"
description = "Autonomous multi-agent document generation platform - generates 29 comprehensive documents from a single idea"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Swaroop", email = "ksjpswaroop@gmail.com" }
]
keywords = [
    "document-generation",
    "multi-agent",
    "fastapi",
    "ollama",
    "prD",
    "architecture",
    "automation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    "aiofiles>=23.2.1",
    "httpx>=0.26.0",
    "sqlalchemy>=2.0.25",
    "aiosqlite>=0.19.0",
    "python-statemachine>=2.1.0",
    "typer>=0.9.0",
    "rich>=13.7.0",
    "structlog>=23.3.0",
    "ollama>=0.1.6",
    "langgraph>=0.0.18",
    "langchain>=0.1.0",
    "jinja2>=3.1.3",
    "markdown>=3.5.1",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "prometheus-client>=0.19.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "tenacity>=8.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.3",
    "pytest-cov>=4.1.0",
    "pytest-benchmark>=4.0.0",
    "ruff>=0.1.14",
    "mypy>=1.8.0",
    "black>=23.12.1",
]
tauri = [
    "tauri-cli>=2.0.0",
]

[project.scripts]
dobby = "src.cli:app"

[project.urls]
Homepage = "https://github.com/ksjpswaroop/dobby"
Repository = "https://github.com/ksjpswaroop/dobby"
Documentation = "https://github.com/ksjpswaroop/dobby/docs"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --benchmark-enable"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
